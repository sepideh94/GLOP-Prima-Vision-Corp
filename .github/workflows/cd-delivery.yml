name: CD - Build Spring Boot JAR (cosBack only)

on:
  push:
    branches: [ main ]   # Exécute seulement sur main

jobs:
  build-jar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cosBack

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Package Spring Boot JAR
        run: mvn -B -ntp clean package -DskipTests

      - name: Upload built JAR
        uses: actions/upload-artifact@v4
        with:
          name: springboot-app
          path: cosBack/target/*.jar
