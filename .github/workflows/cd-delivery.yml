name: CD - Build Spring Boot JAR (Delivery only)

on:
  push:
    branches: [ main ]   # Exécute seulement sur main

jobs:
  build-jar:
    runs-on: ubuntu-latest

    steps:
      #  Récupérer le code
      - name: Checkout repository
        uses: actions/checkout@v4

      #  Installer JDK 21 (même que ton pom.xml)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      #  Compiler le projet et créer le .jar
      - name: Package Spring Boot JAR
        run: |
          cd back
          mvn -B clean package -DskipTests

      #  Sauvegarder le livrable .jar
      - name: Upload built JAR
        uses: actions/upload-artifact@v4
        with:
          name: springboot-app
          path: back/target/*.jar
