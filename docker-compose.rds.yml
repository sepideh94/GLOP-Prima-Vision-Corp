version: "3.9"

services:
  backend:
    image: 336617737159.dkr.ecr.eu-north-1.amazonaws.com/ciblorgasport-backend:latest
    container_name: ciblorgasport-backend
    environment:
      # Base de données RDS
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      SERVER_PORT: "8083"
      SPRING_PROFILES_ACTIVE: "prod"
      APP_SEED_ENABLED: "true"
      APP_SEED_DOCUMENTS_ENABLED: "true"
      # CORS
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://51.21.16.8:3000},http://frontend:80,http://frontend,http://ciblorgasport-frontend

      # EMAIL (Brevo SMTP)
      SPRING_MAIL_HOST: ${MAIL_HOST}
      SPRING_MAIL_PORT: ${MAIL_PORT}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}

      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: "true"

      MAIL_FROM: ${MAIL_FROM}
      APP_BASE_URL: ${APP_BASE_URL}
      API_BASE_URL: ${API_BASE_URL}
      APP_FRONTEND_HASH_ROUTER: ${APP_FRONTEND_HASH_ROUTER:-true}

      # S3 (AWS)
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_REGION: ${S3_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

    ports:
      - "8083:8083"
    networks:
      - ciblorgasport-network
    restart: unless-stopped

  frontend:
    image: 336617737159.dkr.ecr.eu-north-1.amazonaws.com/ciblorgasport-frontend:latest
    container_name: ciblorgasport-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ciblorgasport-network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ciblorgasport-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ciblorgasport.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    networks:
      - ciblorgasport-network
    restart: unless-stopped

networks:
  ciblorgasport-network:
    driver: bridge

