version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ciblorgasport-postgres
    environment:
      POSTGRES_DB: ciblorgasport
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ciblorgasport-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ciblorgasport || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    image: 336617737159.dkr.ecr.eu-north-1.amazonaws.com/ciblorgasport-backend:latest
    container_name: ciblorgasport-backend
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ciblorgasport
      DB_USER: postgres
      DB_PASSWORD: postgres123

      SERVER_PORT: "8083"
      SPRING_PROFILES_ACTIVE: "prod"

      # CORS
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://51.21.16.8:3000},http://frontend:80,http://frontend,http://ciblorgasport-frontend

      # EMAIL (Brevo SMTP)
      SPRING_MAIL_HOST: ${MAIL_HOST}
      SPRING_MAIL_PORT: ${MAIL_PORT}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}

      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: "true"

      MAIL_FROM: ${MAIL_FROM}
      APP_BASE_URL: ${APP_BASE_URL}
      API_BASE_URL: ${API_BASE_URL}

      # S3 (AWS)
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_REGION: ${S3_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ciblorgasport-network
    restart: unless-stopped

  frontend:
    image: 336617737159.dkr.ecr.eu-north-1.amazonaws.com/ciblorgasport-frontend:latest
    container_name: ciblorgasport-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ciblorgasport-network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ciblorgasport-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ciblorgasport.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    networks:
      - ciblorgasport-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  ciblorgasport-network:
    driver: bridge