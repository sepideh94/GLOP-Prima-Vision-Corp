# APPLICATION GLOBALE
spring.application.name=CiblOrgaSport
server.port=8080

# BASE DE DONNEES POSTGRESQL
# Docker: utiliser le nom du service comme hostname (ex: postgres)
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:ciblorgasport}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate (JPA)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JSON WEB TOKEN (JWT)
token.secret.key=5357ef4109843d66b24a19167ff9d1a7be6ec7cc2573a338aa6aca565ab0bae4
token.expirationms=86400000

# SPRING SECURITY
spring.main.allow-bean-definition-overriding=true

# CORS (valeur lue depuis env, pas d'IP hardcodée)
# Exemple env: CORS_ALLOWED_ORIGINS=http://localhost:3000,http://51.21.16.8:3000,http://frontend,http://frontend:80
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# LOGGING
logging.level.root=INFO
logging.level.com.ciblorgasport=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
