# APPLICATION GLOBALE
spring.application.name=CiblOrgaSport
server.port=8083

# BASE DE DONNEES POSTGRESQL
# Docker: utiliser le nom du service comme hostname (ex: postgres)
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:ciblorgasport}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate (JPA)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JSON WEB TOKEN (JWT)
token.secret.key=5357ef4109843d66b24a19167ff9d1a7be6ec7cc2573a338aa6aca565ab0bae4
token.expirationms=86400000

# SPRING SECURITY
spring.main.allow-bean-definition-overriding=true

# CORS (valeur lue depuis env, pas d'IP hardcodée)
# Exemple env: CORS_ALLOWED_ORIGINS=http://localhost:3000,http://51.21.16.8:3000,http://frontend,http://frontend:80
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# LOGGING
logging.level.root=INFO
logging.level.com.ciblorgasport=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# EMAIL (Brevo SMTP)
spring.mail.host=${SPRING_MAIL_HOST:${MAIL_HOST:smtp-relay.brevo.com}}
spring.mail.port=${SPRING_MAIL_PORT:${MAIL_PORT:587}}
spring.mail.username=${SPRING_MAIL_USERNAME:${MAIL_USERNAME:}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:}}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# APP LINKS in emails
app.base-url=${APP_BASE_URL:http://localhost:3000}
api.base-url=${API_BASE_URL:http://localhost:8083}

# Liens dans les e-mails : en prod Docker le front est souvent en HashRouter (/#/route)
app.frontend.use-hash-router=${APP_FRONTEND_HASH_ROUTER:false}

mail.from=${MAIL_FROM:ciblorgasport@gmail.com}

# SPRING PROFILE
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# FILE UPLOAD LIMITS
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# S3/MINIO STORAGE
storage.s3.bucket-name=${S3_BUCKET_NAME:ciblorgasport-documents}
storage.s3.region=${S3_REGION:eu-north-1}

# ENCRYPTION (AES-256 key, 64 hex chars)
encryption.secret-key=${ENCRYPTION_SECRET_KEY:a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2}

# Google Maps
googlemaps.api-key=${GOOGLE_MAPS_API_KEY:AIzaSyCjhDxLNlMMt_WOtpClivFugZDFj7PD7Ek}
