# APPLICATION GLOBALE
spring.application.name=CiblOrgaSport
server.port=8080

# BASE DE DONNEES POSTGRESQL
# Pour Docker: utiliser le nom du service comme hostname
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ciblorgasport}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate (JPA)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

#JSON WEB TOKEN (JWT)
# Cle secrete pour signer les tokens (en Base64)
# node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
token.secret.key=5357ef4109843d66b24a19167ff9d1a7be6ec7cc2573a338aa6aca565ab0bae4

# expiration du token en millisecondes (ici 1 jour = 24h)
token.expirationms=86400000

# LOGGING (pour voir les infos dans la console)
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# SPRING SECURITY (optionnel mais clair)
spring.main.allow-bean-definition-overriding=true

# CORS Configuration
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true