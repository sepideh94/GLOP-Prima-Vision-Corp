
# APPLICATION GLOBALE
spring.application.name=CiblOrgaSport
server.port=8080

# BASE DE DONNÉES POSTGRESQL
spring.datasource.url=jdbc:postgresql://localhost:5432/ciblorgasport
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate (JPA)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#JSON WEB TOKEN (JWT)
# Clé secrète pour signer les tokens (en Base64 !)
#  node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"// Dans le terminal pour générer un nouveau token
token.secret.key=5357ef4109843d66b24a19167ff9d1a7be6ec7cc2573a338aa6aca565ab0bae4


# expiration du token en millisecondes (ici 1 jour = 24h)
token.expirationms=86400000


#  LOGGING (pour voir les infos dans la console)
logging.level.org.springframework.security=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

=
# SPRING SECURITY (optionnel mais clair)
spring.main.allow-bean-definition-overriding=true
