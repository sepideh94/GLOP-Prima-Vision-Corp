# Base de données locale / Docker
# En Docker, `DB_HOST` doit pointer vers le service Postgres (ex: `postgres`).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ciblorgasport}

# MinIO local configuration
storage.s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
storage.s3.access-key=${S3_ACCESS_KEY:minioadmin}
storage.s3.secret-key=${S3_SECRET_KEY:minioadmin}
storage.s3.path-style-access=true
