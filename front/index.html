<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Inscription</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body style="font-family:sans-serif;max-width:560px;margin:40px auto;">
  <h1>Formulaire d'inscription</h1>
  <form id="form">
    <label>Nom complet<br><input name="full_name" required></label><br><br>
    <label>Email<br><input name="email" type="email" required></label><br><br>
    <label>Mot de passe<br><input name="password" type="password" required></label><br><br>
    <button type="submit">S'inscrire</button>
  </form>
  <pre id="out" style="background:#f6f8fa;padding:12px;border-radius:6px;"></pre>

  <script>
    const out = document.getElementById('out');

    function show(obj) { out.textContent = typeof obj === 'string' ? obj : JSON.stringify(obj, null, 2); }

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = new FormData(e.target);

      // ⚠️ Clé attendue par Spring: fullName (camelCase)
      const payload = {
        fullName: form.get('full_name'),
        email: form.get('email'),
        password: form.get('password'),
      };

      show('Envoi...');
      try {
        const res = await fetch('http://localhost:8000/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        // Tente de lire le JSON même en cas d'erreur
        let data = null;
        try { data = await res.json(); } catch { /* ignore */ }

        if (!res.ok) {
          show({
            ok: false,
            status: res.status,
            statusText: res.statusText,
            error: data?.error || data?.message || data || 'Erreur inconnue'
          });
          return;
        }

        show(data || { ok: true, message: 'User registered' });
      } catch (err) {
        show({ ok: false, error: err.message });
      }
    });
  </script>
</body>
</html>
