<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Inscription</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; }
    button[disabled] { opacity: .6; cursor: not-allowed; }
    .ok { color: #0a7; }
    .err { color: #c00; }
    pre { background:#f6f8fa; padding:12px; border-radius:6px; white-space:pre-wrap; }
  </style>
</head>
<body>
  <h1>Formulaire d'inscription</h1>

  <form id="form" autocomplete="on">
    <label>Nom complet<br><input name="full_name" required></label><br><br>
    <label>Email<br><input name="email" type="email" required></label><br><br>
    <label>Mot de passe<br><input name="password" type="password" minlength="8" required></label><br><br>
    <button id="btn" type="submit">S'inscrire</button>
  </form>

  <pre id="out"></pre>

  <script>
    const out = document.getElementById('out');
    const btn = document.getElementById('btn');
    const formEl = document.getElementById('form');

    function show(obj, cls) {
      out.className = cls || '';
      out.textContent = typeof obj === 'string' ? obj : JSON.stringify(obj, null, 2);
    }

    // Détecte l'environnement : local (localhost/127.0.0.1) vs serveur (IP/DNS)
    const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    const API_BASE = isLocal ? 'http://localhost:8000' : `http://${location.hostname}:8000`;

    formEl.addEventListener('submit', async (e) => {
      e.preventDefault();

      const form = new FormData(e.target);
      // ⚠️ Backend attend camelCase: fullName
      const payload = {
        fullName: form.get('full_name'),
        email: form.get('email'),
        password: form.get('password'),
      };

      btn.disabled = true;
      show('Envoi...');

      try {
        const res = await fetch(`${API_BASE}/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        let data = null;
        try { data = await res.json(); } catch { /* peut ne pas être JSON */ }

        if (!res.ok) {
          show({
            ok: false,
            status: res.status,
            statusText: res.statusText,
            error: data?.error || data?.message || data || 'Erreur inconnue',
          }, 'err');
          return;
        }

        show(data || { ok: true, message: 'User registered' }, 'ok');
        // Nettoie le formulaire si succès
        e.target.reset();
      } catch (err) {
        show({ ok: false, error: err.message }, 'err');
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
