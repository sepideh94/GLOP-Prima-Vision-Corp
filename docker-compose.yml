services:
  postgres:
    image: postgres:16-alpine
    container_name: ciblorgasport-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-ciblorgasport}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT_PUBLISHED:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ciblorgasport-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ciblorgasport} || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./cosBack
      dockerfile: Dockerfile
    container_name: ciblorgasport-backend
    environment:
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-ciblorgasport}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://frontend:80,http://frontend,http://ciblorgasport-frontend}
    ports:
      - "${BACKEND_PORT_PUBLISHED:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ciblorgasport-network
    restart: unless-stopped

  frontend:
    build:
      context: ./cosFront
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: ciblorgasport-frontend
    ports:
      - "${FRONTEND_PORT_PUBLISHED:-3000}:80"
    depends_on:
      - backend
    networks:
      - ciblorgasport-network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ciblorgasport-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@ciblorgasport.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT_PUBLISHED:-5050}:80"
    networks:
      - ciblorgasport-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  ciblorgasport-network:
    driver: bridge
