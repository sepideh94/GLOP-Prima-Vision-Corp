services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: ciblorgasport-postgres
    environment:
      POSTGRES_DB: ciblorgasport
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pwd
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ciblorgasport-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ciblorgasport || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Backend Spring Boot
  backend:
    build:
      context: ./cosBack
      dockerfile: Dockerfile
    container_name: ciblorgasport-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ciblorgasport
      DB_USER: postgres
      DB_PASSWORD: pwd
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://frontend:80
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ciblorgasport-network
    restart: unless-stopped

  # Frontend React
  frontend:
    build:
      context: ./cosFront
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    container_name: ciblorgasport-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ciblorgasport-network
    restart: unless-stopped

# Volumes pour la persistance des données
volumes:
  postgres_data:
    driver: local

# Réseau pour la communication entre les services
networks:
  ciblorgasport-network:
    driver: bridge